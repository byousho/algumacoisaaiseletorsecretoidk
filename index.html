<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Ação proibida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Primeiro tenta fundo.png na mesma pasta do HTML; se não existir, usa o Imgur. */
  --bg-img:url("fundo.png"),url("https://i.imgur.com/ABWKgOM.png");
  --paper:rgba(250,247,240,.82);
  --ink:#4a4540;
  --ink-soft:#7d766c;
  --border:rgba(160,150,130,.35);
  --line:#dde3e6;
  --margin:#dcbcb5;
  --accent:#a97d74;
  --accent-dk:#8a6158;
  --green:#83937a;
  --green-dk:#66755e;
  --title:'Kiwi Maru',serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh}
body{font-family:var(--sans);color:var(--ink);background:#cfd6d4;overflow-x:hidden}
body::before{
  content:"";position:fixed;inset:0;z-index:0;
  background-image:var(--bg-img);
  background-position:center;background-size:cover;background-repeat:no-repeat;
}
main{position:relative;z-index:1;max-width:940px;margin:auto;padding:36px 16px}

.sheet{
  position:relative;background:var(--paper);border:1px solid var(--border);border-radius:6px;
  box-shadow:0 4px 16px rgba(60,50,40,.10);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.panel{padding:18px 18px 16px;margin-bottom:20px}
.grid .panel{margin-bottom:0}
.panel h2{margin:0 0 10px;font-family:var(--title);font-weight:500;font-size:1rem;color:var(--ink)}
p{color:var(--ink-soft);line-height:1.5;margin:8px 0}
.count{font-size:.8rem;color:var(--ink-soft);margin-top:6px}

textarea{
  width:100%;min-height:210px;resize:vertical;padding:6px 12px 6px 42px;border:1px solid var(--border);border-radius:3px;
  font:16px/26px var(--sans);color:var(--ink);
  background:
    linear-gradient(90deg,transparent 32px,var(--margin) 32px,var(--margin) 33px,transparent 33px),
    repeating-linear-gradient(180deg,transparent 0 25px,var(--line) 25px 26px),#fdfcf8;
  background-attachment:local;
}
textarea::placeholder{color:#bdb5a6}
textarea:focus{outline:2px solid rgba(131,147,122,.45);outline-offset:1px}

button{
  font:600 .92rem var(--sans);cursor:pointer;padding:8px 16px;margin:6px 8px 0 0;border-radius:4px;
  background:#f4f1ea;color:var(--ink);border:1px solid var(--border);
  transition:background .15s,filter .15s;
}
button:hover:not(:disabled),button:focus-visible{background:#ebe6db;outline:none}
button.primary{color:#fff;background:var(--accent);border-color:var(--accent-dk)}
button.primary:hover:not(:disabled){background:var(--accent-dk)}
button.secondary{color:#fff;background:var(--green);border-color:var(--green-dk)}
button.secondary:hover:not(:disabled){background:var(--green-dk)}
button:disabled{opacity:.45;cursor:not-allowed}

.msg{margin-top:12px;padding:9px 12px;background:rgba(253,252,248,.9);border-radius:3px;line-height:1.45;font-size:.92rem}
.warn{color:var(--accent-dk);border-left:4px solid var(--accent)}
.success{color:var(--green-dk);border-left:4px solid var(--green)}
.banner{margin:0 0 20px}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--border)}
.name{font-family:var(--title);min-width:150px}
.lid{font-size:.72rem;color:var(--ink-soft);margin-left:6px}
.link{
  flex:1;min-width:230px;padding:6px 9px;font:.8rem ui-monospace,Consolas,monospace;background:#fdfcf8;color:var(--ink-soft);
  border:1px solid var(--border);border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
button.copy{margin:0;padding:5px 12px;font-size:.84rem}
.round-foot{margin-top:12px}
.small{font-size:.88rem;color:var(--ink-soft)}
.tag{font-size:.72rem;letter-spacing:.14em;color:var(--ink-soft)}
.hidden{display:none!important}

.reveal{min-height:calc(100vh - 72px);display:grid;place-items:center}
.card{max-width:560px;width:100%;text-align:center;padding:34px 26px 28px}
.card h1{font-family:var(--title);font-weight:500;font-size:clamp(1.4rem,4vw,1.9rem);margin:10px 0 4px}
.who{font-family:var(--title);color:var(--green-dk)}
.meta{font-size:.76rem;color:var(--ink-soft);margin-top:4px}
.item{font-family:var(--title);font-size:clamp(1.7rem,6vw,3rem);line-height:1.25;margin:14px 0 10px;word-break:break-word;color:var(--accent-dk);animation:fade .3s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media(max-width:720px){
  .grid{grid-template-columns:1fr}
  .name{min-width:110px}
}
@media(prefers-reduced-motion:reduce){
  .item{animation:none}
  button{transition:none}
}
</style>
</head>
<body>

<main id="app"></main>

<script>
"use strict";

/* =====================================================================
   CONFIGURAÇÃO
   SEGREDO: frase que cifra os links. Trocar invalida TODOS os links.
   ENCERRADOS: IDs de links bloqueados (ex.: ["k7f3qa","m2p9xd"]).
   ===================================================================== */
const CONFIG={
  SEGREDO:"troque-esta-frase-antes-de-publicar",
  ENCERRADOS:[],
};

/*
  - Um link individual por pessoa e rodada.
  - A ação proibida vai cifrada (AES-GCM) no # da URL, que não chega ao servidor.
  - Ações já sorteadas não voltam nas rodadas seguintes.
  - Listas: um item por linha ou separados por |. Vírgula não separa.
*/

const app=document.getElementById("app");
const te=new TextEncoder(), td=new TextDecoder();

/* ---------- base64url ---------- */
function toB64u(bytes){
  let s="";
  for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function fromB64u(s){
  const bin=atob(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4));
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}

/* ---------- cifra ---------- */
let keyPromise=null;
function getKey(){
  if(!keyPromise){
    keyPromise=crypto.subtle.digest("SHA-256",te.encode("seletor|"+CONFIG.SEGREDO))
      .then(h=>crypto.subtle.importKey("raw",h,"AES-GCM",false,["encrypt","decrypt"]));
  }
  return keyPromise;
}
async function seal(obj){
  const key=await getKey();
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,te.encode(JSON.stringify(obj))));
  const all=new Uint8Array(iv.length+ct.length);
  all.set(iv); all.set(ct,iv.length);
  return toB64u(all);
}
async function unseal(data){
  const all=fromB64u(data);
  const key=await getKey();
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:all.slice(0,12)},key,all.slice(12));
  return JSON.parse(td.decode(pt));
}

/* ---------- utilidades ---------- */
function rnd(n){
  const a=new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0]%n;
}
function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    const j=rnd(i+1);
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function linkId(){
  const c="abcdefghjkmnpqrstuvwxyz23456789";
  let s="";
  for(let i=0;i<6;i++) s+=c[rnd(c.length)];
  return s;
}
function baseUrl(){ return location.href.split("#")[0]; }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function isClosed(id){
  return CONFIG.ENCERRADOS.map(v=>String(v).replace(/^#/,"").toLowerCase()).includes(String(id).toLowerCase());
}
function plural(n,s,p){ return n+" "+(n===1?s:p); }
async function copyText(t){
  try{
    await navigator.clipboard.writeText(t);
    return true;
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    let ok=false;
    try{ ok=document.execCommand("copy"); }catch(_){}
    ta.remove();
    return ok;
  }
}

/* Quebra por linha e por |, remove bullets/numeração, detecta repetidos. */
function parseList(raw){
  const parts=raw.replace(/\r\n?/g,"\n").split(/\n|\|/)
    .map(x=>x.trim().replace(/^(?:[-*•▪◦]\s+|\d+[.)]\s+)/,"").trim())
    .filter(Boolean);
  const seen=new Map(), dups=new Set();
  for(const p of parts){
    const k=p.toLowerCase();
    if(seen.has(k)) dups.add(p); else seen.set(k,p);
  }
  return {list:[...seen.values()],dups:[...dups]};
}

/* ---------- estado (só nesta aba) ---------- */
const rounds=[];
const usedItems=new Set();
const draft={people:"",items:""};

window.addEventListener("beforeunload",e=>{
  if(rounds.length){ e.preventDefault(); e.returnValue=""; }
});

/* ---------- participante ---------- */
function messageCard(title,text){
  app.innerHTML=`<div class="reveal"><section class="card sheet">
    <h1>${escapeHtml(title)}</h1>
    ${text?`<p>${escapeHtml(text)}</p>`:""}
  </section></div>`;
}

function reveal(payload){
  const who=payload.n!==undefined?`<div class="who">${escapeHtml(payload.n)}</div>`:"";
  const meta=[payload.r?"rodada "+payload.r:"",payload.id?"#"+payload.id:""].filter(Boolean).map(escapeHtml).join(" · ");
  app.innerHTML=`<div class="reveal"><section class="card sheet">
    <h1>Sua ação proibida</h1>
    ${who}
    <div class="meta">${meta}</div>
    <button id="open" class="primary">Revelar</button>
    <div id="result" class="hidden">
      <div class="item">${escapeHtml(payload.i)}</div>
      <div class="small">Guarde este link para rever.</div>
    </div>
  </section></div>`;

  document.getElementById("open").onclick=()=>{
    document.getElementById("open").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");
  };
}

async function openLink(data){
  messageCard("Abrindo...","");
  try{
    const payload=await unseal(data);
    if(payload.id&&isClosed(payload.id)) messageCard("Link encerrado.","");
    else reveal(payload);
  }catch(e){
    messageCard("Link inválido.","Peça um novo ao organizador.");
  }
}

/* ---------- organizador ---------- */
function roundHtml(r){
  return `<section class="panel sheet" data-round="${r.n}">
    <h2>Rodada ${r.n}</h2>
    ${r.rows.map((x,i)=>`<div class="row">
      <div class="name">${escapeHtml(x.p)}<span class="lid">#${x.id}</span></div>
      <input class="link" readonly value="${escapeHtml(x.link)}">
      <button class="copy" data-r="${r.n}" data-i="${i}">Copiar</button>
    </div>`).join("")}
    <div class="round-foot">
      <button class="secondary copyRound" data-r="${r.n}">Copiar todos</button>
    </div>
  </section>`;
}

function organizer(){
const next=rounds.length+1;
const banner=location.protocol==="file:"
  ?`<div class="msg warn banner">Aberto localmente: os links só funcionam neste PC. Use a versão publicada.</div>`:"";

app.innerHTML=`${banner}
<div class="grid">
<section class="panel sheet">
  <h2>Participantes</h2>
  <textarea id="people" placeholder="Um por linha ou separados por |"></textarea>
  <div class="count" id="countPeople"></div>
</section>
<section class="panel sheet">
  <h2>Ações proibidas</h2>
  <textarea id="items" placeholder="Uma por linha ou separadas por |"></textarea>
  <div class="count" id="countItems"></div>
</section>
</div>

<section class="panel sheet">
  <button id="draw" class="primary">Gerar rodada ${next}</button>
  ${rounds.length?`<button id="clearAll">Limpar rodadas</button>`:""}
  <div id="status"></div>
</section>

<div id="rounds">${rounds.slice().reverse().map(roundHtml).join("")}</div>`;

const $=id=>document.getElementById(id);
$("people").value=draft.people;
$("items").value=draft.items;

function updateCounts(){
  draft.people=$("people").value;
  draft.items=$("items").value;
  const p=parseList(draft.people).list.length;
  const all=parseList(draft.items).list;
  const used=all.filter(x=>usedItems.has(x.toLowerCase())).length;
  $("countPeople").textContent=plural(p,"participante","participantes");
  $("countItems").textContent=plural(all.length,"ação","ações")+
    (used?` (${used} já sorteada${used===1?"":"s"})`:"");
}
$("people").addEventListener("input",updateCounts);
$("items").addEventListener("input",updateCounts);
updateCounts();

if($("clearAll")) $("clearAll").onclick=()=>{
  if(!confirm("Limpar as rodadas? Links enviados continuam válidos.")) return;
  rounds.length=0;
  usedItems.clear();
  organizer();
};

document.querySelectorAll(".copy").forEach(b=>{
  b.onclick=async()=>{
    const r=rounds.find(x=>x.n===+b.dataset.r);
    const ok=await copyText(r.rows[+b.dataset.i].link);
    b.textContent=ok?"Copiado":"Falhou";
    setTimeout(()=>b.textContent="Copiar",1200);
  };
});
document.querySelectorAll(".copyRound").forEach(b=>{
  b.onclick=async()=>{
    const r=rounds.find(x=>x.n===+b.dataset.r);
    const text="Rodada "+r.n+"\n"+r.rows.map(x=>`${x.p} [#${x.id}]: ${x.link}`).join("\n");
    const ok=await copyText(text);
    b.textContent=ok?"Copiado":"Falhou";
    setTimeout(()=>b.textContent="Copiar todos",1200);
  };
});

$("draw").onclick=async()=>{
  const status=$("status");
  const P=parseList($("people").value);
  const I=parseList($("items").value);
  const people=P.list;
  const items=I.list.filter(x=>!usedItems.has(x.toLowerCase()));

  if(!people.length||!I.list.length){
    status.innerHTML='<div class="msg warn">Preencha participantes e ações.</div>';
    return;
  }
  if(P.dups.length){
    status.innerHTML=`<div class="msg warn">Nomes repetidos: ${P.dups.map(escapeHtml).join(", ")}.</div>`;
    return;
  }
  if(items.length<people.length){
    status.innerHTML=`<div class="msg warn">Faltam ações: ${items.length} disponíveis para ${plural(people.length,"participante","participantes")}.</div>`;
    return;
  }

  $("draw").disabled=true;
  try{
    const n=rounds.length+1;
    const chosen=shuffle(items).slice(0,people.length);
    const rows=[];
    for(const [i,p] of shuffle(people).entries()){
      const id=linkId();
      const data=await seal({v:3,n:p,i:chosen[i],r:n,id});
      rows.push({p,id,link:baseUrl()+"#d="+data});
    }
    chosen.forEach(x=>usedItems.add(x.toLowerCase()));
    rounds.push({n,rows});

    organizer();
    $("status").innerHTML=`<div class="msg success">Rodada ${n} gerada. Envie cada link individualmente. Recarregar a página apaga as listas.</div>`;
  }catch(e){
    status.innerHTML=`<div class="msg warn">Erro ao gerar (${escapeHtml(e.message||e)}). Use a versão publicada (https).</div>`;
    $("draw").disabled=false;
  }
};
}

/* ---------- roteamento ---------- */
function route(){
  const hash=location.hash;
  if(hash.startsWith("#d=")) openLink(hash.slice(3));
  else if(hash.startsWith("#r=")) messageCard("Link antigo.","Peça um novo ao organizador.");
  else organizer();
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
